# Deciqo - deployment lokal. Juri menjalankan `docker compose up --build -d` dari root repo.
#
# Tiga service:
#   api      FastAPI + SQLite di volume `deciqo-data` (akun, katalog, temuan, keputusan).
#   web      build React disajikan nginx, meneruskan /api/ ke api.
#   woo-demo toko WooCommerce SINTETIS (image yang sama dengan api) supaya konektor Woo bisa
#            didemokan tanpa toko nyata. Hanya terjangkau dari jaringan internal Compose.
#
# Port dibind ke 127.0.0.1: aplikasi ini menyimpan akun dan data toko, jadi tidak dibuka ke
# jaringan venue secara default.

# Nama project tetap: tanpa ini Compose menurunkannya dari nama folder, sehingga clone di folder
# lain (atau start.bat vs terminal di direktori berbeda) membuat volume baru yang kosong.
name: deciqo-local

x-api-env: &api-env
  TZ: Asia/Jakarta
  DECIQO_DB_PATH: /data/deciqo.sqlite3

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8000:8000"
    # .env opsional: clone bersih tanpa key apa pun tetap jalan dalam mode aturan.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    volumes:
      # Checkpoint IndoBERT tidak ikut ke git; dipasang read-only dari host. Tanpa checkpoint,
      # triage memakai leksikon dan /api/v1/readiness menyebutnya.
      - ./models:/app/models:ro
      - hf-cache:/cache/hf
      - deciqo-data:/data
    depends_on:
      woo-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 8s
      # Pemuatan IndoBERT pada CPU dingin ~1 menit; endpoint Deciqo sudah melayani sebelum itu.
      start_period: 120s
      retries: 5

  woo-demo:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    command: ["uvicorn", "app.deciqo.mock_woo:app", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: Asia/Jakarta
      DECIQO_MOCK_DB_PATH: /data/woo-demo.sqlite3
    volumes:
      - woo-demo-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    environment:
      - TZ=Asia/Jakarta

volumes:
  hf-cache:
  deciqo-data:
  woo-demo-data:
