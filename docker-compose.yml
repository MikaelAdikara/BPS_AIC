# Deciqo - deployment lokal. Juri menjalankan `docker compose up --build -d` dari root repo.
#
# Tiga service:
#   api      FastAPI + SQLite di volume `deciqo-data` (akun, katalog, temuan, keputusan).
#   web      build React disajikan nginx, meneruskan /api/ ke api.
#   woo-demo toko WooCommerce SINTETIS (image yang sama dengan api) supaya konektor Woo bisa
#            didemokan tanpa toko nyata. Hanya terjangkau dari jaringan internal Compose.
#
# Port dibind ke 127.0.0.1: aplikasi ini menyimpan akun dan data toko, jadi tidak dibuka ke
# jaringan venue secara default.

# Nama project tetap: tanpa ini Compose menurunkannya dari nama folder, sehingga clone di folder
# lain (atau start.bat vs terminal di direktori berbeda) membuat volume baru yang kosong.
name: deciqo-local

x-api-env: &api-env
  TZ: Asia/Jakarta
  DECIQO_DB_PATH: /data/deciqo.sqlite3

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8000:8000"
    # .env opsional: clone bersih tanpa key apa pun tetap jalan dalam mode aturan.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    volumes:
      # Checkpoint IndoBERT tidak ikut ke git; dipasang read-only dari host. Tanpa checkpoint,
      # triage memakai leksikon dan /api/v1/readiness menyebutnya.
      - ./models:/app/models:ro
      - hf-cache:/cache/hf
      - deciqo-data:/data
    depends_on:
      woo-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 8s
      # Pemuatan IndoBERT pada CPU dingin ~1 menit; endpoint Deciqo sudah melayani sebelum itu.
      start_period: 120s
      retries: 5

  woo-demo:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    command: ["uvicorn", "app.deciqo.mock_woo:app", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: Asia/Jakarta
      DECIQO_MOCK_DB_PATH: /data/woo-demo.sqlite3
    volumes:
      - woo-demo-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 10

  # --- Toko WooCommerce ASLI untuk demo (opsional) ------------------------------------------
  # `docker compose --profile store up -d --build` → storefront http://localhost:8081,
  # admin http://localhost:8081/wp-admin. Ulasan baru memicu webhook WooCommerce ke `api`.
  # Isi toko sama dengan katalog demo (data sintetis buatan tim).
  wp-db:
    profiles: ["store"]
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 20

  wordpress:
    profiles: ["store"]
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    environment:
      TZ: Asia/Jakarta
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Browser membuka localhost:8081, sedangkan api memanggil http://wordpress di jaringan
      # internal: WP_HOME tetap localhost:8081 supaya tautan produk mengarah ke alamat browser.
      # Lewat Cloudflare quick tunnel (profile `tunnel`) alamatnya https://<acak>.trycloudflare.com;
      # hanya host dengan akhiran itu yang dipercaya sebagai alamat publik (bukan Host bebas).
      # Environment `local` mengizinkan application password lewat HTTP.
      WORDPRESS_CONFIG_EXTRA: |
        $$deciqo_host = strtolower($$_SERVER['HTTP_HOST'] ?? '');
        if (preg_match('/^[a-z0-9-]+\.trycloudflare\.com$$/', $$deciqo_host)) {
          $$_SERVER['HTTPS'] = 'on';
          define('WP_HOME', 'https://' . $$deciqo_host);
          define('WP_SITEURL', 'https://' . $$deciqo_host);
        } else {
          define('WP_HOME', 'http://localhost:8081');
          define('WP_SITEURL', 'http://localhost:8081');
        }
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
      DECIQO_STORE_URL: http://localhost:8081
      DECIQO_STORE_ADMIN_USER: ${WOO_LOCAL_USER:-deciqo}
      DECIQO_STORE_ADMIN_PASSWORD: ${WOO_LOCAL_ADMIN_PASSWORD:-deciqo-demo-2026}
      DECIQO_STORE_API_PASSWORD: ${WOO_LOCAL_API_PASSWORD:-deciqoLocalStoreKey2026}
      DECIQO_WEBHOOK_URL: http://api:8000/api/v1/deciqo/woo/webhook
      DECIQO_WEBHOOK_SECRET: ${WOO_WEBHOOK_SECRET:-deciqo-local-webhook-secret}
    volumes:
      - wp-html:/var/www/html
    depends_on:
      wp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/deciqo-ready && curl -fsS -o /dev/null http://127.0.0.1/wp-json/"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60

  # --- Tunnel publik untuk demo (opsional) ---------------------------------------------------
  # Cloudflare quick tunnel: tanpa akun, URL https://<acak>.trycloudflare.com baru setiap start.
  # `python scripts/demo_tunnel.py` menyalakan semuanya dan mencetak URL + QR. Jalankan
  # `python scripts/demo_tunnel.py keys` dulu supaya password demo bawaan diganti yang acak.
  tunnel-store:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://wordpress:80"]
    depends_on:
      wordpress:
        condition: service_healthy

  tunnel-app:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started
    environment:
      - TZ=Asia/Jakarta

volumes:
  hf-cache:
  deciqo-data:
  woo-demo-data:
  wp-db-data:
  wp-html:
