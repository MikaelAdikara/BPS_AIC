server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Contoh berkas CSV di /templates: tanpa ini nginx mengirimnya sebagai octet-stream, dan
  # sebagian peramban ponsel lalu tidak tahu harus membukanya dengan apa.
  location /templates/ {
    types { text/csv csv; application/json json; }
    default_type text/plain;
    add_header Content-Disposition "attachment";
  }

  # SPA: seluruh rute tidak dikenal dikembalikan ke index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Frontend memanggil /api/... dengan URL relatif, sehingga kode yang sama berjalan di
  # dev (proxy Vite) maupun di sini tanpa alamat backend yang di-hardcode.
  location /api/ {
    proxy_pass         http://api:8000;
    proxy_set_header   Host $host;
    proxy_http_version 1.1;

    # Analisis 1.000 ulasan pada CPU bisa melewati satu menit. Batas bawaan nginx 60 detik
    # akan memutusnya di tengah jalan dan terlihat seperti kegagalan sistem.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
