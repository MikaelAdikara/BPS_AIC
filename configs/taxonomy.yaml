# Taksonomi aspek — blueprint bagian 18.2
#
# STATUS: FROZEN (Fase 0, dikonfirmasi). Perubahan setelah titik ini wajib persetujuan
# seluruh tim dan HARUS diedit di blueprint lebih dulu (blueprint bagian 39.1).
#
# Mekanisme adaptasi (bagian 18.2): aspek universal selalu aktif; aspek spesifik kategori
# diaktifkan/dinonaktifkan dari field `category` pada data ingestion. Menambah kategori baru
# TIDAK memerlukan retraining model — hanya pemetaan label output ke taksonomi ini.

status: frozen
frozen_at_phase: 0
version: 1.0.0
source: "INSIGHTULASAN_BLUEPRINT.md bagian 18.2"

# Enum kategori produk — selaras schema Raw Review (bagian 25.1)
categories: [fashion, food_beverage, craft, electronics, other]

aspects:
  # --- Universal: aktif di semua kategori ---
  - id: kualitas_produk
    label: "Kualitas produk"
    scope: universal

  - id: kesesuaian_deskripsi
    label: "Kesesuaian deskripsi"
    scope: universal

  - id: harga_value
    label: "Harga dan value"
    scope: universal

  - id: kemasan
    label: "Kemasan"
    scope: universal
    relevance_weight:
      food_beverage: high # bagian 18.2: bobot relevansi lebih tinggi untuk F&B

  - id: pengiriman
    label: "Pengiriman"
    scope: universal

  - id: pelayanan_penjual
    label: "Pelayanan/respons penjual"
    scope: universal

  # --- Universal dengan relabel per kategori ---
  # Keputusan Fase 0: "porsi/takaran" untuk F&B adalah RELABEL aspek yang sama,
  # bukan aspek terpisah. Alasan: bentuk keluhannya identik secara struktural
  # ("jumlah/ukuran tidak sesuai ekspektasi"), sehingga tidak perlu kelas label
  # tambahan yang harus dipetakan dari dataset publik.
  - id: ukuran_varian
    label: "Ukuran/varian"
    scope: universal_with_relabel
    label_overrides:
      food_beverage: "Porsi/takaran"
      craft: "Dimensi produk"

  # --- Spesifik kategori: dinonaktifkan di kategori yang tidak relevan ---
  - id: rasa_kualitas_makanan
    label: "Rasa/kualitas makanan"
    scope: category_specific
    active_for: [food_beverage]
    # Blueprint 18.2 eksplisit: "dinonaktifkan otomatis berbasis kategori produk".

  - id: kelengkapan
    label: "Kelengkapan"
    scope: category_specific
    active_for: [fashion, craft, electronics, other]

  - id: keaslian
    label: "Keaslian"
    scope: category_specific
    active_for: [fashion, craft, electronics, other]

  - id: kemudahan_penggunaan
    label: "Kemudahan penggunaan"
    scope: category_specific
    active_for: [craft, electronics, other]

# Catatan interpretasi (Fase 0): blueprint 18.2 hanya menyebut penonaktifan otomatis secara
# eksplisit untuk rasa_kualitas_makanan; untuk kelengkapan/keaslian/kemudahan_penggunaan
# blueprint memakai frasa "kurang relevan". Keputusan tim: perlakukan "kurang relevan"
# sebagai NONAKTIF pada kategori tersebut, karena menampilkan aspek yang tidak relevan
# (mis. "keaslian" untuk toko F&B) merusak kepercayaan pada relevansi sistem (persona 5.3).
# Ini murni keputusan config — dapat dibalik tanpa retraining.

# Enum sentimen dan severity — schema Text Prediction (bagian 25.4)
sentiments: [positif, negatif, netral]
severities: [rendah, sedang, tinggi]
